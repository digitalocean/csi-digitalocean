### Release a new CSI version from the Actions UI.
### Select the release branch (master or release-*) and provide the tag to create.
name: release

env:
  DOCKER_REPO: ghcr.io/digitalocean-packages/do-csi-plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag and release to create (e.g. v4.21.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Check out the branch selected in the workflow_dispatch UI
          # (master or a release-* branch).
          fetch-depth: 1

      - name: Log into GHCR
        run: echo "${{ secrets.GHCRTOKEN }}" | docker login ghcr.io --username "${{ secrets.GHCRUSER }}" --password-stdin

      # Rebuild plugin instead of just promoting the latest :master image so
      # that the right version is correctly baked into the release via the -X
      # flag.
      - name: Build and push released plugin image
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: make publish

      - name: Bump version and generate release manifests
        env:
          NEW_VERSION: ${{ github.event.inputs.tag }}
        run: make bump-version

      - name: Commit release manifests
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5
        with:
          message: "create release manifests for ${{ github.event.inputs.tag }}"
          add: "deploy/kubernetes/releases/ VERSION CHANGELOG.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find target commit to tag
        run: |
          sha=$(git rev-parse HEAD)
          echo "TARGET_SHA=$sha" >> $GITHUB_ENV

      - name: Create Github release
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974  # v2.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_commitish: ${{ env.TARGET_SHA }}
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          body: |
            See the [change log](CHANGELOG.md) for release details.

            Refer to the [installation instructions](README.md#installing-to-kubernetes) to learn how the CSI driver can be installed. (**Note:** The driver comes pre-installed already for [DOKS](https://www.digitalocean.com/products/kubernetes/) users.)
          draft: false
