name: cleanup-clusters

env:
  RUNNER_REPO: ghcr.io/digitalocean-packages/k8s-e2e-test-runner

on:
  pull_request:
    types: [closed]

jobs:
  cleanup-clusters:
    name: Clean up clusters from the PR
    runs-on: ubuntu-latest
    steps:
      - name: Log into GHCR
        run: echo "${{ secrets.GHCRTOKEN }}" | docker login ghcr.io --username digitalocean-engineering --password-stdin

      - name: cleanup
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.CSIDigitalOceanAccessToken }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          # Variable definitions and runner image must match things in test.yaml.

          BRANCH="$(echo -n ${BRANCH} | tr -c '[:alnum:]._-' '-')"
          TAG_IDENTIFIER="$(echo -n ${BRANCH} | sha256sum | cut -c1-7)"
          docker run --rm -e DIGITALOCEAN_ACCESS_TOKEN --entrypoint /cleanup-clusters.sh ${RUNNER_REPO}:${BRANCH}-latest "branch-identifier:${TAG_IDENTIFIER}"
